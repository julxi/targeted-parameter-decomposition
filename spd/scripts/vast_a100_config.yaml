# Machine selection for `spd-vast --config a100` (see VastConfig in spd/scripts/run_vast.py).
# A100 SXM4 with 40 GB (80 GB variants also match, if under max_price). Chosen on 26-10-06 over the
# memory-modded 48 GB RTX 4090: similar price (from ~$0.42/h), about twice the offers, and SXM
# modules only run in server boards, so hosts are server operations even when vast.ai does not
# label them datacenter. 40 GB fits the bf16 tPD training on Qwen2.5-7B (~27 GB peak at batch 16).
# See convos/julian/26-10-05_vast_rentals_SUMMARY.md.

# vast.ai GPU name, spaces as underscores. Browse with `spd-vast --list_offers --config a100`.
gpu_name: A100_SXM4

# Maximum total price in $/hour, including storage.
max_price: 1.0

# Minimum GPU memory in GB. Note vast.ai filters this in GB but reports it in MB.
min_gpu_ram: 40

# Disk to rent in GB. Needs room for the repo, the uv venv (torch is several GB), the Qwen2.5-7B
# weights (~15 GB) and checkpoints.
disk: 60

# Docker image. Must be CUDA >= 12.8 to match the torch wheels in uv.lock.
image: vastai/base-image:cuda-12.8.1-auto

# Minimum host reliability. Low-reliability hosts drop runs mid-training.
min_reliability: 0.98

# Only 1 of 12 A100 SXM4 offers was datacenter-labelled on 26-10-06, so the filter is off.
datacenter_only: false

# Minimum CUDA version the host supports.
min_cuda: 12.8

# Sort order; the first offer is the one rented.
#   dlperf_per_dphtotal-  best deep-learning performance per dollar
#   dph_total             cheapest first
#   reliability-          most reliable first
sort: dlperf_per_dphtotal-

# How many offers to fetch and show.
n_offers: 20

# How long `uv sync` may take on the rented machine before the host is rejected (and blacklisted).
max_sync_minutes: 10.0
