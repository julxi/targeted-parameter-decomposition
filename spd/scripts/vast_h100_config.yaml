# H100 machine config for `spd-vast --config h100`.
# For the big LM experiments. H100 supply on vast.ai is thin (often only a handful of
# single-GPU offers), so the ceilings here are deliberately loose - check what exists with
# `spd-vast --list_offers --config h100` before relying on it.
# Other variants: H100_PCIE (slower interconnect), H100_NVL (93GB).

gpu_name: H100_SXM
max_price: 8.0
min_gpu_ram: 79
disk: 100
image: vastai/base-image:cuda-12.8.1-auto
min_reliability: 0.98
# All hosts: H100 rentals have worked without the filter, and it would halve the few offers.
datacenter_only: false
min_cuda: 12.8
sort: dph_total
n_offers: 20
max_sync_minutes: 10.0
