# Grid for spd/experiments/rotgrid/rotgrid_sweep.py. Every swept leaf is a {values: [...]} list,
# and the full cartesian product is run. Entries of a discriminated list such as
# `loss_metric_configs` are identified by their `classname`, not by their position.
seed:
  values: [0,1,2,3]

steps:
  values: [25000]

module_info:
  values:
    - [{module_pattern: "blocks.*.attn.out_proj", C: 10}]


ci_config:
  hidden_dims:
    values: [[32]]


loss_metric_configs:
  - classname: ImportanceMinimalityLoss
    # Written as decimals because YAML reads bare `3e-2` as a string, not a float.
    coeff:
      values: [0.01, 0.005]


  

