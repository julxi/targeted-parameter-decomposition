# Qwen2.5-7B-Instruct — targeted decomposition on Truth-is-Universal statements
# (Bürger et al. 2024, https://github.com/sciai-lab/Truth_is_Universal).
#
# One of three arms that differ ONLY in task_config.loss_positions (and label):
#   config_truth_all_tokens.yaml   {type: tokens}        every real token; no padding trained on
#   config_truth_last_token.yaml   {type: last_k, k: 1}  only the statement's last token ('.' or "'.")
#   config_truth_padded.yaml       {type: all}           every position incl. right padding; with
#                                                        max_seq_len 24 and a mean statement length
#                                                        of ~10 tokens, >50% of trained positions
#                                                        are padding (replicates an earlier setup)
# Positions outside the selection are dropped from every loss and metric AND run on the original
# weights (no component substitution), so the decomposition only has to reproduce the computation
# at the selected positions. The CI values are later probed for statement truth by a separate
# analysis script.
#
# Model, module_info, losses and optimisation were carried over from an earlier capitals config
# (since deleted) that adapted numpy_and_pandas_4L/config_numpy_reference.yaml to Qwen. Not tuned
# for Qwen. Narrowed for memory: decomposing all 28 layers x 7 projections OOMs on the dense
# weight-delta tensors, and the ~152k-vocab logits limit batch_size. Layers 15-19 down_proj are an
# unvalidated guess.
#
# Target data: all 20 tiu v1 datasets (true and false, affirmative and negated, all domains), see
# data/README.md. They share a train/test split by subject (city, Spanish word, element, animal,
# number pair). Training concatenates the train splits (6560 statements); eval metrics use the
# held-out test splits.
#
# Nontarget eval reads the Pile's validation file (val.jsonl.zst), disjoint from the 30 train/*
# files that make up the default 'train' split. Reading 'train' with the same dataset_seed would
# make the eval batches the very documents of the first training steps.
#
# Batch size, steps and eval size were tuned on the all-tokens arm only (26-10-03, single seed per
# setting): batch 16 / 5,000 steps matched batch 4 / 10,000 steps on target reconstruction and beat
# it on PGD reconstruction, Pile reconstruction and sparsity, in about two thirds of the wall time
# (batch 4 is overhead-bound on an H100: a batch-16 step costs ~1.3x a batch-4 step). A 2x learning
# rate (1e-3) improved target reconstruction but doubled the Pile reconstruction loss, so 5e-4 was
# kept. The other arms inherit these settings untested. The last-token arm trains on one position
# per statement (~16 per batch vs ~160 for all-tokens), so its gradient is much noisier and it may
# need its own tuning (e.g. a larger batch).

# --- WandB ---
wandb_project: spd
wandb_run_name: null
wandb_run_name_prefix: ""
sync_checkpoints_to_wandb: true
label: "tiu_all_tokens"

# --- General ---
seed: 0
n_mask_samples: 1
ci_config:
  mode: global
  fn_type: global_shared_mlp
  hidden_dims: [512]
sampling: continuous
sigmoid_type: leaky_hard
module_info:
  - module_pattern: model.layers.15.mlp.down_proj
    C: 96
  - module_pattern: model.layers.16.mlp.down_proj
    C: 96
  - module_pattern: model.layers.17.mlp.down_proj
    C: 96
  - module_pattern: model.layers.18.mlp.down_proj
    C: 96
  - module_pattern: model.layers.19.mlp.down_proj
    C: 96
identity_module_info: null
use_delta_component: true

# --- Loss config ---
loss_metric_configs:
  - classname: ImportanceMinimalityLoss
    coeff: 1.0e-3
    pnorm: 2.0
    beta: 0.2
    p_anneal_start_frac: 0.0
    p_anneal_final_p: 1.0
    p_anneal_end_frac: 1.0
    eps: 1.0e-12
    coeff_warmup_frac: 0.2
    coeff_peak_multiplier: 4.0
    coeff_anneal_start_frac: 0.2
    coeff_anneal_end_frac: 1.0
  - classname: StochasticReconSubsetLoss
    coeff: 1
    routing:
      type: uniform_k_subset
  - classname: PersistentPGDReconLoss
    coeff: 0.5
    optimizer:
      type: adam
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        start_val: 0.01
        warmup_pct: 0.025
        final_val_frac: 0.1
        fn_type: cosine
    scope:
      type: per_batch_per_position
    use_sigmoid_parameterization: false
    n_warmup_steps: 2
    start_frac: 0.8
output_loss_type: kl

# --- Training ---
lr_schedule:
  start_val: 5e-4
  warmup_pct: 0.0
  final_val_frac: 0.1
  fn_type: cosine
steps: 5_000
batch_size: 16
eval_batch_size: 16
grad_clip_norm_components: 0.01
grad_clip_norm_ci_fns: null
component_weight_decay: 0.1
autocast_bf16: true

# --- Faithfulness Warmup ---
faithfulness_warmup_steps: 0

# --- Logging & Saving ---
train_log_freq: 100
eval_freq: 500
slow_eval_freq: 2500
# 16 x eval_batch_size = 256 held-out statements per eval; 32 statements were too noisy to
# compare runs.
n_eval_steps: 16
slow_eval_on_first_step: true
# Final checkpoint only (238 MB each): the WandB account has 5 GB, and intermediate checkpoints
# have no planned use.
save_freq: null
ci_alive_threshold: 0.01

# --- Eval Metrics ---
eval_metric_configs:
  - classname: CI_L0
    groups:
      total:
        - "*"
  - classname: PGDReconLoss
    init: random
    step_size: 0.1
    n_steps: 20
    mask_scope: shared_across_batch
  - classname: TargetReconLoss
    rounding_threshold: 0.01
  - classname: NontargetReconLoss
    rounding_threshold: 0.01
    n_nontarget_batches: 10
  - classname: TargetedCIHeatmap
    n_nontarget_examples: 16
  - classname: WeightMagnitude
  - classname: UnmaskedReconLoss
  - classname: CIMeanPerComponent
  - classname: CIHiddenActsReconLoss

# --- Pretrained model info ---
pretrained_model_class: transformers.AutoModelForCausalLM
pretrained_model_path: null
pretrained_model_name: Qwen/Qwen2.5-7B-Instruct
pretrained_model_output_attr: logits
tokenizer_name: Qwen/Qwen2.5-7B-Instruct

# --- Task Specific (target data) ---
task_config:
  task_name: lm
  max_seq_len: 24  # longest statement is 20 Qwen tokens (neg_cities)
  prepared_datasets:
    - data/tiu/animal_class_false/v1
    - data/tiu/animal_class_true/v1
    - data/tiu/cities_false/v1
    - data/tiu/cities_true/v1
    - data/tiu/element_symb_false/v1
    - data/tiu/element_symb_true/v1
    - data/tiu/larger_than_false/v1
    - data/tiu/larger_than_true/v1
    - data/tiu/neg_animal_class_false/v1
    - data/tiu/neg_animal_class_true/v1
    - data/tiu/neg_cities_false/v1
    - data/tiu/neg_cities_true/v1
    - data/tiu/neg_element_symb_false/v1
    - data/tiu/neg_element_symb_true/v1
    - data/tiu/neg_sp_en_trans_false/v1
    - data/tiu/neg_sp_en_trans_true/v1
    - data/tiu/smaller_than_false/v1
    - data/tiu/smaller_than_true/v1
    - data/tiu/sp_en_trans_false/v1
    - data/tiu/sp_en_trans_true/v1
  loss_positions:
    type: tokens

# --- Targeted Decomposition (nontarget data: general text) ---
nontarget_task_config:
  task_name: lm
  dataset_name: monology/pile-uncopyrighted
  max_seq_len: 64
  column_name: text
  is_tokenized: false
  streaming: true
  train_data_split: train
  eval_data_split: validation
  eval_data_files: val.jsonl.zst
  dataset_seed: 0
  loss_positions:
    type: all
nontarget_batch_size: 16
nontarget_eval_batch_size: 16  # x n_nontarget_batches 10 x 64 tokens = 10,240 Pile tokens
nontarget_impmin_coeff_ratio: 2
