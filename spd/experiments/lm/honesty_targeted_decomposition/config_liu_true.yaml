# Qwen2.5-7B-Instruct — targeted decomposition (honest vs. dishonest)
# Mirrors spd/experiments/lm/targeted_decomposition/numpy_and_pandas_4L/config_numpy_reference.yaml
#
# NOTE on values carried over unchanged from the numpy/pandas 4L config vs.
# values changed for this run -- read before your first launch:
#   - module_info / C: numpy_and_pandas_4L targeted a small 4-layer toy model.
#     Qwen2.5-7B has a much larger hidden dim (3584 vs the toy model's much
#     smaller width) and 28 layers instead of 4. The C values below are a
#     STARTING GUESS carried over proportionally, not a validated setting --
#     treat this as your first sweep point, not a known-good number.
#   - batch_size/eval_batch_size: originally set to 16 (matching your
#     memory_dryrun.py results), but a real run hit an OOM at step 0 inside
#     the KL-div reconstruction loss itself -- Qwen2.5's ~152k vocabulary
#     means logits tensors scale as batch_size x seq_len x vocab_size,
#     which memory_dryrun.py's stand-in loss never modeled. Cut to 4 as a
#     safe starting point; raise it again once you confirm this runs, since
#     4 is a conservative guess, not a measured ceiling.
#   - max_seq_len: placeholder 64 -- set this to whatever
#     build_prompts_files.py reports as your actual max token length.
#   - nontarget corpus: every existing targeted-decomposition config in this
#     repo (css/, numpy_and_pandas_4L/, numpy_and_pandas_12L/) uses
#     `danbraunai/pile-uncopyrighted-tok-shuffled` (is_tokenized: true) as
#     the nontarget/background corpus -- that IS the repo-wide default, not
#     something numpy/pandas picked specifically. But it's pre-tokenized for
#     EleutherAI/gpt-neox-20b's vocabulary (that's the tokenizer_name paired
#     with it in every one of those configs), which is NOT Qwen's
#     tokenizer -- reusing those token IDs directly with Qwen would silently
#     feed it IDs from the wrong vocabulary. This config instead uses
#     `monology/pile-uncopyrighted` (the raw, untokenized source those
#     pre-tokenized versions were built from) with is_tokenized: false, so
#     it's tokenized on the fly with Qwen's own tokenizer -- same corpus
#     family as the repo default, just not pre-tokenized for a different model.

# --- WandB ---
wandb_project: spd
wandb_run_name: null
wandb_run_name_prefix: ""
sync_checkpoints_to_wandb: false
label: "bare_liu_true"

# --- General ---
seed: 0
n_mask_samples: 1
ci_config:
  mode: global
  fn_type: global_shared_mlp
  hidden_dims: [512]
sampling: continuous
sigmoid_type: leaky_hard
module_info:
  # NARROWED after a real OOM: the original 28-layer x 7-projection scope
  # materialized ~6.5B params' worth of weight-delta tensors simultaneously
  # in calc_weight_deltas() (one dense d_out x d_in tensor per targeted
  # module, all kept in memory at once) -- on top of the ~15GB base model
  # (loaded in full bf16 here, not quantized), that blew past 24GB before
  # a single training step ran. Batch size was never the bottleneck.
  #
  # Starting point instead: 5 layers (15-19, informed by the Mahalanobis
  # probe paper's finding on where Qwen-family honesty signal concentrates),
  # MLP down_proj only. This is a genuine guess at WHICH layers/matrices
  # matter for honesty specifically -- validate and widen from here once
  # this actually runs, rather than assuming these five are the right ones.
  - module_pattern: model.layers.15.mlp.down_proj
    C: 96
  - module_pattern: model.layers.16.mlp.down_proj
    C: 96
  - module_pattern: model.layers.17.mlp.down_proj
    C: 96
  - module_pattern: model.layers.18.mlp.down_proj
    C: 96
  - module_pattern: model.layers.19.mlp.down_proj
    C: 96
identity_module_info: null
use_delta_component: true

# --- Loss config ---
# Carried over from numpy_and_pandas_4L/config_numpy_reference.yaml unchanged.
# These loss coefficients were tuned for a small toy model on a much narrower
# task (single-token completion) -- worth a sanity check / small sweep before
# trusting them at 7B scale on a longer-context task.
loss_metric_configs:
  - classname: ImportanceMinimalityLoss
    coeff: 1.0e-3
    pnorm: 2.0
    beta: 0.2
    p_anneal_start_frac: 0.0
    p_anneal_final_p: 1.0
    p_anneal_end_frac: 1.0
    eps: 1.0e-12
    coeff_warmup_frac: 0.2
    coeff_peak_multiplier: 4.0
    coeff_anneal_start_frac: 0.2
    coeff_anneal_end_frac: 1.0
  - classname: StochasticReconSubsetLoss
    coeff: 1
    routing:
      type: uniform_k_subset
  - classname: PersistentPGDReconLoss
    coeff: 0.5
    optimizer:
      type: adam
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        start_val: 0.01
        warmup_pct: 0.025
        final_val_frac: 0.1
        fn_type: cosine
    scope:
      type: per_batch_per_position
    use_sigmoid_parameterization: false
    n_warmup_steps: 2
    start_frac: 0.8
output_loss_type: kl

# --- Training ---
lr_schedule:
  start_val: 5e-4
  warmup_pct: 0.0
  final_val_frac: 0.1
  fn_type: cosine
steps: 10_000  # lower than numpy_4L's 30k -- your verified set is much
                # smaller (74 pairs vs. a repeated single-line prompt), so
                # this needs re-checking against eval curves, not assumed
batch_size: 4  # cut from 16 after real training-step OOM in KL-div loss (~152k vocab x batch x seq_len logits tensors -- a genuine per-step cost, unlike the earlier setup-time bug)
eval_batch_size: 4
grad_clip_norm_components: 0.01
grad_clip_norm_ci_fns: null
component_weight_decay: 0.1
autocast_bf16: true

# --- Faithfulness Warmup ---
faithfulness_warmup_steps: 0

# --- Logging & Saving ---
train_log_freq: 100
eval_freq: 1000
slow_eval_freq: 4000
n_eval_steps: 1
slow_eval_on_first_step: true
save_freq: 2000  # was null (final-step-only save) -- now also checkpoints every 2000 steps so you can compare component evolution, not just the end state
ci_alive_threshold: 0.01

# --- Eval Metrics ---
eval_metric_configs:
  - classname: CI_L0
    groups:
      total:
        - "*"
  - classname: PGDReconLoss
    init: random
    step_size: 0.1
    n_steps: 20
    mask_scope: shared_across_batch
  - classname: TargetReconLoss
    rounding_threshold: 0.01
  - classname: NontargetReconLoss
    rounding_threshold: 0.01
    n_nontarget_batches: 10
  - classname: TargetedCIHeatmap
    n_nontarget_examples: 16  # cut from 100 -- TargetedCIHeatmap runs ONE forward pass on this many examples at once, ignoring nontarget_batch_size entirely; 100 (matching all 74 target prompts nearly 1:1) OOM'd on lm_head's vocab-size logits
  - classname: WeightMagnitude
  - classname: UnmaskedReconLoss
  - classname: CIMeanPerComponent
  - classname: CIHiddenActsReconLoss

# --- Pretrained model info ---
pretrained_model_class: transformers.AutoModelForCausalLM
pretrained_model_path: null
pretrained_model_name: Qwen/Qwen2.5-7B-Instruct
pretrained_model_output_attr: logits
tokenizer_name: Qwen/Qwen2.5-7B-Instruct

# --- Task Specific (target data) ---
task_config:
  task_name: lm
  prompts_file: prompts_liu/all_domains_true.txt
  max_seq_len: 128  # bare Liu et al. statements vary more in length than capitals (some hotpot_qa_re/triva_qa_re questions run long) -- not independently verified against actual token counts, treat as a safety margin, not a measured number

# --- Targeted Decomposition (nontarget data: general text) ---
# is_tokenized: false because Qwen's tokenizer differs from the
# pre-tokenized Pile/openwebtext datasets used in the GPT-2/toy-model
# configs -- this tokenizes raw text on the fly with tokenizer_name above.
nontarget_task_config:
  task_name: lm
  dataset_name: monology/pile-uncopyrighted
  max_seq_len: 64
  column_name: text
  is_tokenized: false
  streaming: true
  train_data_split: train
  eval_data_split: train
  dataset_seed: 0
nontarget_batch_size: 4
nontarget_eval_batch_size: 4
nontarget_impmin_coeff_ratio: 2
