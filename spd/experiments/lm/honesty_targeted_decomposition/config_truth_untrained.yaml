# Qwen2.5-7B-Instruct — UNTRAINED decomposition baseline for the Truth-is-Universal tPD arms
# (config_truth_all_tokens.yaml, config_truth_last_token.yaml, config_truth_padded.yaml).
#
# `steps: 0` makes the run save the freshly initialised decomposition as model_0.pth and stop: no
# training, no evals. Purpose: check whether the CI functions already carry truth information
# without any training, i.e. whether probes on CI values can detect statement truth just because
# the CI network is a (random) nonlinear readout of the MLP activations, which are known to encode
# truth. Probe results on trained arms are then read relative to this.
#
# It is a copy of config_truth_all_tokens.yaml with only `steps` and `label` changed. Keeping the
# seed, model, module_info and ci_config the same as the arms makes this exactly their starting
# point, but the baseline's purpose doesn't depend on that. Training-only settings (losses, lr,
# eval/save frequencies, loss_positions) have no effect at 0 steps.

# --- WandB ---
wandb_project: spd
wandb_run_name: null
wandb_run_name_prefix: ""
sync_checkpoints_to_wandb: true
label: "tiu_untrained"

# --- General ---
seed: 0
n_mask_samples: 1
ci_config:
  mode: global
  fn_type: global_shared_mlp
  hidden_dims: [512]
sampling: continuous
sigmoid_type: leaky_hard
module_info:
  - module_pattern: model.layers.15.mlp.down_proj
    C: 96
  - module_pattern: model.layers.16.mlp.down_proj
    C: 96
  - module_pattern: model.layers.17.mlp.down_proj
    C: 96
  - module_pattern: model.layers.18.mlp.down_proj
    C: 96
  - module_pattern: model.layers.19.mlp.down_proj
    C: 96
identity_module_info: null
use_delta_component: true

# --- Loss config ---
loss_metric_configs:
  - classname: ImportanceMinimalityLoss
    coeff: 1.0e-3
    pnorm: 2.0
    beta: 0.2
    p_anneal_start_frac: 0.0
    p_anneal_final_p: 1.0
    p_anneal_end_frac: 1.0
    eps: 1.0e-12
    coeff_warmup_frac: 0.2
    coeff_peak_multiplier: 4.0
    coeff_anneal_start_frac: 0.2
    coeff_anneal_end_frac: 1.0
  - classname: StochasticReconSubsetLoss
    coeff: 1
    routing:
      type: uniform_k_subset
  - classname: PersistentPGDReconLoss
    coeff: 0.5
    optimizer:
      type: adam
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        start_val: 0.01
        warmup_pct: 0.025
        final_val_frac: 0.1
        fn_type: cosine
    scope:
      type: per_batch_per_position
    use_sigmoid_parameterization: false
    n_warmup_steps: 2
    start_frac: 0.8
output_loss_type: kl

# --- Training ---
lr_schedule:
  start_val: 5e-4
  warmup_pct: 0.0
  final_val_frac: 0.1
  fn_type: cosine
steps: 0  # save the initial decomposition and stop
batch_size: 16
eval_batch_size: 16
grad_clip_norm_components: 0.01
grad_clip_norm_ci_fns: null
component_weight_decay: 0.1
autocast_bf16: true

# --- Faithfulness Warmup ---
faithfulness_warmup_steps: 0

# --- Logging & Saving ---
train_log_freq: 100
eval_freq: 500
slow_eval_freq: 2500
# 16 x eval_batch_size = 256 held-out statements per eval; 32 statements were too noisy to
# compare runs.
n_eval_steps: 16
slow_eval_on_first_step: true
save_freq: 1000
ci_alive_threshold: 0.01

# --- Eval Metrics ---
eval_metric_configs:
  - classname: CI_L0
    groups:
      total:
        - "*"
  - classname: PGDReconLoss
    init: random
    step_size: 0.1
    n_steps: 20
    mask_scope: shared_across_batch
  - classname: TargetReconLoss
    rounding_threshold: 0.01
  - classname: NontargetReconLoss
    rounding_threshold: 0.01
    n_nontarget_batches: 10
  - classname: TargetedCIHeatmap
    n_nontarget_examples: 16
  - classname: WeightMagnitude
  - classname: UnmaskedReconLoss
  - classname: CIMeanPerComponent
  - classname: CIHiddenActsReconLoss

# --- Pretrained model info ---
pretrained_model_class: transformers.AutoModelForCausalLM
pretrained_model_path: null
pretrained_model_name: Qwen/Qwen2.5-7B-Instruct
pretrained_model_output_attr: logits
tokenizer_name: Qwen/Qwen2.5-7B-Instruct

# --- Task Specific (target data) ---
task_config:
  task_name: lm
  max_seq_len: 24  # longest statement is 20 Qwen tokens (neg_cities)
  prepared_datasets:
    - data/tiu/animal_class_false/v1
    - data/tiu/animal_class_true/v1
    - data/tiu/cities_false/v1
    - data/tiu/cities_true/v1
    - data/tiu/element_symb_false/v1
    - data/tiu/element_symb_true/v1
    - data/tiu/larger_than_false/v1
    - data/tiu/larger_than_true/v1
    - data/tiu/neg_animal_class_false/v1
    - data/tiu/neg_animal_class_true/v1
    - data/tiu/neg_cities_false/v1
    - data/tiu/neg_cities_true/v1
    - data/tiu/neg_element_symb_false/v1
    - data/tiu/neg_element_symb_true/v1
    - data/tiu/neg_sp_en_trans_false/v1
    - data/tiu/neg_sp_en_trans_true/v1
    - data/tiu/smaller_than_false/v1
    - data/tiu/smaller_than_true/v1
    - data/tiu/sp_en_trans_false/v1
    - data/tiu/sp_en_trans_true/v1
  loss_positions:
    type: tokens

# --- Targeted Decomposition (nontarget data: general text) ---
nontarget_task_config:
  task_name: lm
  dataset_name: monology/pile-uncopyrighted
  max_seq_len: 64
  column_name: text
  is_tokenized: false
  streaming: true
  train_data_split: train
  eval_data_split: validation
  eval_data_files: val.jsonl.zst
  dataset_seed: 0
  loss_positions:
    type: all
nontarget_batch_size: 16
nontarget_eval_batch_size: 16  # x n_nontarget_batches 10 x 64 tokens = 10,240 Pile tokens
nontarget_impmin_coeff_ratio: 2
